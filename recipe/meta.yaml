{% set name = "intake-salesforce" %}
{% set version = "0.0.10" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/intake-salesforce-{{ version }}.tar.gz
  sha256: b8393f17f1555963c15e6667e7a4795838604bfbfde3b4d0cdbe0ea97aa68706

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - intake
    - pandas
    - python >={{ python_min }}
    - simple-salesforce

test:
  imports:
    - intake_salesforce
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/sophiamyang/intake-salesforce
  summary: Intake driver to load Salesforce data
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - sophiamyang
